name: vote-saint-arnoux

services:
  web:
    build: ./docker/php
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./:/var/www/app
    environment:
      APP_URL: "http://localhost:${WEB_PORT:-8080}"
      APP_ENV: dev
      DB_HOST: db
      DB_NAME: vote
      DB_USER: vote
      DB_PASS: vote
      MAIL_FROM: "jury@saint-arnoux.local"
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_SECURE: none
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: vote
      MYSQL_USER: vote
      MYSQL_PASSWORD: vote
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - dbdata:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "${DB_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  dbgate:
    image: dbgate/dbgate
    ports:
      - "${DBGATE_PORT:-8081}:3000"
    environment:
      CONNECTIONS: con1
      LABEL_con1: Vote Saint-Arnoux
      SERVER_con1: db
      USER_con1: root
      PASSWORD_con1: root
      PORT_con1: 3306
      ENGINE_con1: mysql@dbgate-plugin-mysql
    depends_on:
      - db

  # Capture des e-mails en développement (liens magiques) : http://localhost:8025
  mailpit:
    image: axllent/mailpit
    ports:
      - "${MAILPIT_PORT:-8025}:8025"

volumes:
  dbdata:
